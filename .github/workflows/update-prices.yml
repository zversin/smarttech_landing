name: Daily INTANT prices

on:
  schedule:
    # 09:00 Asia/Almaty (UTC+05:00). GitHub cron may start later.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intant-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test supplier parser and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify all INTANT sources and refresh snapshot
        run: python3 scripts/update-intant.py --force --summary "$RUNNER_TEMP/intant-summary.md"
      - name: Test prices, generate offers and validate site
        run: |
          npm test
          npm run build
          npm run lint
          git diff --check
      - name: Check HTTP responses
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > "$RUNNER_TEMP/smarttech-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 scripts/verify-site.py --base http://127.0.0.1:4173 --timeout 30
      - name: Commit verified prices and offers
        id: commit
        run: |
          git add --update
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified INTANT prices and check date'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # smarttech.asia is served by Sites, not GitHub Pages.
      # The linked delivery task retries later the same day and imports only pricing/intant.mjs.
      - name: Save check summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/intant-summary.md" ]; then
            cat "$RUNNER_TEMP/intant-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Порядок: получить → проверить 14 точных SKU → округлить → обновить main → доставить прайс в Sites.' >> "$GITHUB_STEP_SUMMARY"
