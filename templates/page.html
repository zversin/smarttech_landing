<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SmartTech">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    {{IMAGE_META}}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=14">
    <link rel="stylesheet" href="/site-structure.css?v=3">
</head>
<body class="site-page {{PAGE_CLASS}}" data-page="{{PAGE_ID}}">
    <a class="site-skip" href="#main" data-i18n="skipContent">Перейти к содержимому</a>
    {{HEADER}}
    <main id="main">
        {{BODY}}
    </main>
    {{FOOTER}}
    {{MODAL}}
    <a href="https://wa.me/77087262237" target="_blank" rel="noopener" class="floating-wa" aria-label="Написать в WhatsApp" data-i18n="floatingWaText">WhatsApp</a>
    <script id="page-meta" type="application/json">{{META_I18N}}</script>
    <script src="/navigation.js?v=3"></script>
    <script src="/site-i18n.js?v=3"></script>
    <script src="/script.js?v=15"></script>
    {{PAGE_SCRIPTS}}
</body>
</html>
